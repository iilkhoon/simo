services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: simo
      POSTGRES_PASSWORD: simo
      POSTGRES_DB: simo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://simo:simo@db:5432/simo
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "4000:4000"
    depends_on:
      - db

  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads:
