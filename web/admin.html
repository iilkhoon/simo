<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Simo Admin</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .shell { display: grid; grid-template-columns: 230px 1fr; gap: 24px; padding: 24px 0 60px; }
    .side { display: grid; gap: 8px; align-content: start; position: sticky; top: 98px; }
    .side button { text-align: left; height: 46px; padding: 0 16px; border: 0; border-radius: 14px; background: var(--card); font: 700 15px var(--body); color: var(--ink); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .side button.on { background: var(--ink); color: var(--paper); }
    .side .n { min-width: 24px; height: 22px; border-radius: 11px; background: var(--nar); color: #fff; font-size: 12px; display: grid; place-items: center; padding: 0 6px; border: 0; }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .kpi { padding: 18px; }
    .kpi b { display: block; font: 800 30px var(--display); letter-spacing: -0.04em; }
    .kpi span { color: var(--ink2); font-size: 13px; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; background: var(--card); }
    .tbl { border: 0; border-radius: 18px; overflow: auto; box-shadow: var(--sh); }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1.5px solid rgba(23,18,15,.12); font-size: 14px; vertical-align: middle; }
    th { font: 700 11px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); background: var(--paper2); }
    tr:last-child td { border-bottom: 0; }
    .acts { display: flex; gap: 6px; flex-wrap: wrap; }
    .mini { height: 32px; padding: 0 12px; border: 0; border-radius: 999px; font: 700 12px var(--body); cursor: pointer; background: var(--card); color: var(--ink); }
    .mini.ok { background: var(--mint); color: #fff; }
    .mini.no { background: var(--nar); color: #fff; }
    .mini.dk { background: var(--ink); color: var(--paper); }
    .ph { width: 64px; height: 80px; border-radius: 10px; border: 0; object-fit: cover; background: var(--lime); }
    .av { width: 36px; height: 36px; border-radius: 50%; border: 0; object-fit: cover; background: var(--lime); }
    .st { display: inline-block; padding: 2px 8px; border: 0; border-radius: 6px; font: 800 11px var(--body); }
    .login { max-width: 420px; margin: 70px auto; padding: 28px; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .toolbar .input { max-width: 340px; height: 46px; font-size: 15px; }
    #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 99; }
    @media (max-width: 860px) { .shell { grid-template-columns: 1fr; } .side { position: static; grid-template-columns: repeat(2, 1fr); } .kpis { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="logo" href="index.html"><img src="assets/logo.svg" alt="">simo</a>
      <span class="tag" style="background:var(--ink);color:var(--paper)">ADMIN</span>
      <div class="grow"></div>
      <button class="btn sm light hidden" id="logout">Çıxış</button>
    </div>
  </header>

  <div class="wrap">
    <form class="box login hidden" id="loginForm">
      <h2 style="font-size:28px">Admin girişi</h2>
      <label class="field"><span>E-poçt</span><input class="input" id="em" type="email" autocomplete="username" required></label>
      <label class="field"><span>Şifrə</span><input class="input" id="pw" type="password" autocomplete="current-password" required></label>
      <button class="btn" style="width:100%;margin-top:20px">Daxil ol</button>
      <div id="loginErr"></div>
    </form>

    <div class="shell hidden" id="app">
      <aside class="side" id="side"></aside>
      <main id="view"></main>
    </div>
  </div>
  <div id="toast"></div>

  <script src="config.js"></script>
  <script>
  (function () {
    const API = window.SIMO_API;
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = (n) => Number(n || 0).toLocaleString('en-US');
    const date = (d) => (d ? new Date(d).toLocaleString('az-AZ') : '');
    let token = null;
    try { token = sessionStorage.getItem('simo.admin'); } catch (e) { /* ignore */ }
    let tab = 'stats', counts = {};

    function toast(msg, ok = true) {
      $('#toast').innerHTML = `<div class="notice ${ok ? 'ok' : 'err'}" style="box-shadow:var(--sh)">${esc(msg)}</div>`;
      setTimeout(() => ($('#toast').innerHTML = ''), 2600);
    }

    async function api(path, body) {
      const r = await fetch(API + path, {
        method: body ? 'POST' : 'GET',
        headers: { Authorization: `Bearer ${token}`, ...(body ? { 'Content-Type': 'application/json' } : {}) },
        body: body ? JSON.stringify(body) : undefined,
      });
      if (r.status === 401 || r.status === 403) { logout(); throw new Error('AUTH'); }
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.code || 'ERROR');
      return d;
    }

    /** CSV yükləmə: token başlıqda göndərilir, fayl brauzerdə saxlanılır */
    async function download(path, name) {
      const r = await fetch(API + path, { headers: { Authorization: `Bearer ${token}` } });
      if (!r.ok) throw new Error('CSV');
      const url = URL.createObjectURL(await r.blob());
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }
    const almaz = (u) => fmt(Math.round((u || 0) / 10));
    const azn = (u) => ((u || 0) / 100).toFixed(2) + ' ₼';
    const prevWeek = () => { const d = new Date(Date.now() + 4 * 3600000 - 7 * 86400000); const day = (d.getUTCDay() + 6) % 7; return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - day)).toISOString().slice(0, 10); };

    function logout() {
      token = null;
      try { sessionStorage.removeItem('simo.admin'); } catch (e) { /* ignore */ }
      $('#app').classList.add('hidden'); $('#logout').classList.add('hidden'); $('#loginForm').classList.remove('hidden');
    }

    $('#loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('#loginErr').innerHTML = '';
      try {
        const r = await fetch(`${API}/auth/email/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: $('#em').value, password: $('#pw').value }) });
        const d = await r.json();
        if (!r.ok) throw new Error();
        token = d.accessToken;
        await api('/admin/stats');
        try { sessionStorage.setItem('simo.admin', token); } catch (err) { /* ignore */ }
        start();
      } catch (err) {
        token = null;
        $('#loginForm').classList.remove('hidden');
        $('#loginErr').innerHTML = '<div class="notice err">Giriş alınmadı və ya admin hüququ yoxdur</div>';
      }
    });
    $('#logout').addEventListener('click', logout);

    const TABS = [
      ['stats', 'Statistika'], ['hosts', 'Host müraciətləri', 'pendingHosts'], ['users', 'İstifadəçilər'],
      ['withdrawals', 'Pul çıxarışları', 'pendingWithdrawals'], ['reports', 'Şikayətlər', 'openReports'],
      ['kyc', 'Şəxsiyyət təsdiqi', 'pendingKyc'], ['agencies', 'Agentliklər', 'pendingAgencies'], ['settlements', 'Həftəlik hesabat'], ['raffles', 'Çəkilişlər'],
      ['payments', 'Ödənişlər'], ['lives', 'Canlı yayınlar'],
    ];
    function side() {
      $('#side').innerHTML = TABS.map(([k, l, c]) => `<button data-tab="${k}" class="${tab === k ? 'on' : ''}">${l}${c && counts[c] ? `<span class="n">${counts[c]}</span>` : ''}</button>`).join('');
    }
    $('#side').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) { tab = b.dataset.tab; render(); } });

    const table = (head, rows) => `<div class="tbl"><table><thead><tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('') || `<tr><td colspan="${head.length}" class="muted">Boşdur</td></tr>`}</tbody></table></div>`;
    const userCell = (u) => `<div style="display:flex;gap:10px;align-items:center">${u.avatarUrl ? `<img class="av" src="${esc(u.avatarUrl)}" alt="">` : '<span class="av"></span>'}<div><b>${esc(u.name || '—')}</b><div class="muted" style="font-size:12px">ID ${esc(u.shortId)}</div></div></div>`;

    const VIEWS = {
      async stats() {
        const s = await api('/admin/stats');
        counts = s; side();
        const k = [['İstifadəçi', fmt(s.users)], ['Yeni (24s)', fmt(s.newUsers)], ['Onlayn', fmt(s.online)], ['Hostlar', fmt(s.hosts)], ['Canlı yayın', fmt(s.lives)], ['Gəlir (24s)', `${s.revenueDayAzn.toFixed(2)} ₼`], ['Gəlir (30g)', `${s.revenueMonthAzn.toFixed(2)} ₼`], ['Gözləyən çıxarış', fmt(s.pendingWithdrawals)]];
        const bg = ['var(--card)', 'var(--lime)', 'var(--mint-soft)', 'var(--saffron-soft)', 'var(--nar-soft)', 'var(--xazar-soft)', 'var(--saffron)', 'var(--lilac)'];
        return `<h2 style="margin-bottom:18px">Statistika</h2><div class="kpis">${k.map(([l, v], i) => `<div class="box kpi" style="background:${bg[i]}"><b>${v}</b><span>${l}</span></div>`).join('')}</div>`;
      },
      async hosts() {
        const { items } = await api('/admin/users?hostStatus=PENDING');
        return `<h2 style="margin-bottom:18px">Host müraciətləri</h2>` + table(['İstifadəçi', 'Profil foto', 'Selfi', 'Tarix', ''], items.map((u) => `<tr>
          <td>${userCell(u)}</td><td>${u.avatarUrl ? `<img class="ph" src="${esc(u.avatarUrl)}" alt="">` : ''}</td>
          <td>${u.verificationUrl ? `<a href="${esc(u.verificationUrl)}" target="_blank" rel="noopener"><img class="ph" src="${esc(u.verificationUrl)}" alt=""></a>` : '—'}</td>
          <td>${date(u.createdAt)}</td>
          <td class="acts"><button class="mini ok" data-act="host" data-id="${u.id}" data-v="APPROVED">Təsdiq</button><button class="mini no" data-act="host" data-id="${u.id}" data-v="REJECTED">Rədd</button></td></tr>`));
      },
      async users() {
        const q = $('#uq') ? $('#uq').value : '';
        const { items } = await api(`/admin/users?q=${encodeURIComponent(q)}`);
        return `<h2 style="margin-bottom:18px">İstifadəçilər</h2><div class="toolbar"><input class="input" id="uq" placeholder="Ad, telefon, e-poçt və ya ID" value="${esc(q)}"><button class="btn sm dark" data-act="search">Axtar</button></div>` +
          table(['İstifadəçi', 'Əlaqə', 'Nar / Almaz', 'Status', ''], items.map((u) => `<tr>
          <td>${userCell(u)}</td><td style="font-size:13px">${esc(u.phone || u.email || '')}</td>
          <td>Nar ${fmt(u.coins)}<br>Almaz ${fmt(Math.round(u.diamonds / 10))}</td>
          <td>${u.banned ? '<span class="st" style="background:var(--nar-soft)">BLOK</span> ' : ''}${u.hostStatus !== 'NONE' ? `<span class="st" style="background:var(--saffron-soft)">${esc(u.hostStatus)}</span> ` : ''}${u.verified ? '<span class="st" style="background:var(--xazar-soft)">✓</span>' : ''}${u.role === 'ADMIN' ? ' <span class="st">ADMIN</span>' : ''}</td>
          <td class="acts"><button class="mini ${u.banned ? 'ok' : 'no'}" data-act="ban" data-id="${u.id}" data-v="${!u.banned}">${u.banned ? 'Blokdan çıxar' : 'Blokla'}</button><button class="mini" data-act="verify" data-id="${u.id}" data-v="${!u.verified}">${u.verified ? 'Təsdiqi götür' : 'Təsdiqlə'}</button><button class="mini dk" data-act="grant" data-id="${u.id}">+ Nar</button></td></tr>`));
      },
      async withdrawals() {
        const st = $('#wst') ? $('#wst').value : 'OPEN';
        const { items } = await api(`/admin/withdrawals?status=${st}`);
        const bg = { PENDING: 'var(--saffron-soft)', APPROVED: 'var(--xazar-soft)', PAID: 'var(--mint-soft)', REJECTED: 'var(--nar-soft)' };
        return `<h2 style="margin-bottom:18px">Pul çıxarışları</h2>
          <div class="toolbar"><select class="input" id="wst">${[['OPEN', 'Açıq (gözləyən + təsdiqlənmiş)'], ['PENDING', 'Gözləyən'], ['APPROVED', 'Təsdiqlənmiş'], ['PAID', 'Ödənilmiş'], ['REJECTED', 'Rədd edilmiş'], ['ALL', 'Hamısı']].map(([k, l]) => `<option value="${k}" ${k === st ? 'selected' : ''}>${l}</option>`).join('')}</select><button class="btn sm dark" data-act="search">Göstər</button><button class="btn sm light" data-act="csvwd">CSV (30 gün)</button></div>
          <p class="muted" style="margin-bottom:12px">Axın: Gözləyən → Təsdiq (yoxlanıldı) → Ödənildi. Rədd edildikdə səbəb məcburidir və Almaz istifadəçiyə avtomatik qaytarılır. Son 7 günün qazancı çıxarışa düşmür (geri qaytarma riskinə qarşı).</p>` +
          table(['İstifadəçi', 'Məbləğ', 'Üsul / hesab', 'Status', 'Tarix', ''], items.map((w) => `<tr>
          <td>${userCell(w.user)}<div class="muted" style="font-size:12px">${esc(w.user.phone || '')}${w.user.agency ? ` · ${esc(w.user.agency.name)}` : ''}</div><div style="font-size:12px">KYC: <span class="st">${esc(w.user.kycStatus)}</span></div></td>
          <td><b>${(w.amountQepik / 100).toFixed(2)} ₼</b><div class="muted" style="font-size:12px">${almaz(w.diamonds)} Almaz · haqq ${(w.feeQepik / 100).toFixed(2)} ₼</div></td>
          <td>${esc(w.method)}<div style="font-size:13px">${esc(w.account)}</div></td>
          <td><span class="st" style="background:${bg[w.status] || 'var(--card)'}">${esc(w.status)}</span>${w.rejectReason ? `<div class="muted" style="font-size:12px;max-width:200px">${esc(w.rejectReason)}</div>` : ''}</td><td>${date(w.createdAt)}${w.processedAt ? `<div class="muted" style="font-size:12px">${date(w.processedAt)}</div>` : ''}</td>
          <td class="acts">${w.status === 'PENDING' ? `<button class="mini" data-act="wd" data-id="${w.id}" data-v="APPROVED">Təsdiq</button>` : ''}${w.status === 'PENDING' || w.status === 'APPROVED' ? `<button class="mini ok" data-act="wd" data-id="${w.id}" data-v="PAID">Ödənildi</button><button class="mini no" data-act="wd" data-id="${w.id}" data-v="REJECTED">Rədd</button>` : ''}</td></tr>`));
      },
      async reports() {
        const { items } = await api('/admin/reports');
        return `<h2 style="margin-bottom:18px">Şikayətlər</h2>` + table(['Hədəf', 'Səbəb', 'Qeyd', 'Tarix', ''], items.map((r) => `<tr>
          <td><span class="st">${esc(r.targetType)}</span><div class="muted" style="font-size:12px">${esc(r.targetUserId)}</div></td><td><b>${esc(r.reason)}</b></td><td style="max-width:260px">${esc(r.details || '')}</td><td>${date(r.createdAt)}</td>
          <td class="acts"><button class="mini ok" data-act="rep" data-id="${r.id}" data-v="RESOLVED">Həll et</button><button class="mini no" data-act="repban" data-id="${r.id}">Həll et + blokla</button><button class="mini" data-act="rep" data-id="${r.id}" data-v="DISMISSED">Rədd</button></td></tr>`));
      },
      async kyc() {
        const st = $('#kst') ? $('#kst').value : 'PENDING';
        const { items } = await api(`/admin/kyc?status=${st}`);
        const img = (u) => (u ? `<a href="${esc(u)}" target="_blank" rel="noopener"><img class="ph" src="${esc(u)}" alt=""></a>` : '—');
        const age = (d) => { const b = new Date(d); return Math.floor((Date.now() - b.getTime()) / (365.25 * 86400000)); };
        return `<h2 style="margin-bottom:18px">Şəxsiyyət təsdiqi (KYC)</h2><div class="toolbar"><select class="input" id="kst">${['PENDING', 'APPROVED', 'REJECTED'].map((x) => `<option ${x === st ? 'selected' : ''}>${x}</option>`).join('')}</select><button class="btn sm dark" data-act="search">Göstər</button></div>
          <p class="muted" style="margin-bottom:12px">Selfi ilə sənəddəki üzü, ad-soyadı və doğum tarixini müqayisə edin. 18 yaşdan kiçikləri rədd edin. Şəkilləri yükləməyin və paylaşmayın.</p>` +
          table(['İstifadəçi', 'Ad, soyad', 'Doğum tarixi', 'Sənəd', 'Arxa', 'Selfi', 'Profil', ''], items.map((v) => `<tr>
          <td>${userCell(v.user)}</td><td><b>${esc(v.firstName)} ${esc(v.lastName)}</b><div class="muted" style="font-size:12px">${esc(v.docType)}</div></td>
          <td>${date(v.birthDate)}<div class="${age(v.birthDate) < 18 ? '' : 'muted'}" style="font-size:12px;${age(v.birthDate) < 18 ? 'color:var(--nar);font-weight:700' : ''}">${age(v.birthDate)} yaş</div></td>
          <td>${img(v.docFrontUrl)}</td><td>${img(v.docBackUrl)}</td><td>${img(v.selfieUrl)}</td><td>${img(v.user?.avatarUrl)}</td>
          <td class="acts">${v.status === 'PENDING' ? `<button class="mini ok" data-act="kyc" data-id="${v.id}" data-v="APPROVED">Təsdiq</button><button class="mini no" data-act="kyc" data-id="${v.id}" data-v="REJECTED">Rədd</button>` : `<span class="st">${esc(v.status)}</span>${v.note ? `<div class="muted" style="font-size:12px">${esc(v.note)}</div>` : ''}`}</td></tr>`));
      },
      async agencies() {
        const { items } = await api('/admin/agencies');
        const stBg = { PENDING: 'var(--saffron-soft)', ACTIVE: 'var(--mint-soft)', SUSPENDED: 'var(--nar-soft)' };
        return `<h2 style="margin-bottom:18px">Agentliklər</h2><p class="muted" style="margin-bottom:12px">Host həmişə 15% alır. Agentlik komissiyası Simo-nun payından verilir: səviyyəyə görə avtomatik (Bürünc 15% → Brilyant 20%, son 30 günün qazancı) və ya fərdi faiz (0–30%). Sahibin KYC-si təsdiqlənmədən agentlik aktiv edilə bilməz.</p>` +
          table(['Agentlik', 'Sahib', 'Əlaqə', 'Təcrübə', 'Üzv', 'Səviyyə / komissiya', 'Bu həftə', 'Status', ''], items.map((a) => `<tr>
          <td><b>${esc(a.name)}</b><div class="muted" style="font-size:12px">${esc(a.code)}${a.city ? ` · ${esc(a.city)}` : ''}</div>${a.description ? `<div style="font-size:12px;max-width:220px">${esc(a.description)}</div>` : ''}</td>
          <td>${esc(a.owner?.name)} · ${esc(a.owner?.shortId)}<div style="font-size:12px">KYC: <span class="st">${esc(a.owner?.kycStatus || '—')}</span></div></td>
          <td style="font-size:13px">${esc(a.contactName || '')}<br>${esc(a.contactPhone || '')}</td>
          <td style="font-size:13px;max-width:220px">${esc(a.experience || '')}${a.expectedHosts ? `<div class="muted">Gözlənilən host: ${fmt(a.expectedHosts)}</div>` : ''}</td>
          <td>${fmt(a._count?.members)}</td>
          <td><b>${esc(a.tierName)}</b> · ${Math.round(a.share * 100)}%${a.custom ? ' <span class="st" style="background:var(--xazar-soft)">fərdi</span>' : ''}<div class="muted" style="font-size:12px">30g: ${almaz(a.monthlyDiamonds)} Almaz</div></td>
          <td style="font-size:13px">${fmt(a.week?.paidCoins)} Nar<div class="muted" style="font-size:12px">host ${azn(a.week?.hostAmount)} · agentlik ${azn(a.week?.agencyAmount)}</div></td>
          <td><span class="st" style="background:${stBg[a.status] || 'var(--card)'}">${esc(a.status)}</span>${a.rejectReason ? `<div class="muted" style="font-size:12px">${esc(a.rejectReason)}</div>` : ''}</td>
          <td class="acts">${a.status !== 'ACTIVE' ? `<button class="mini ok" data-act="ag" data-id="${a.id}" data-v="ACTIVE">Təsdiq et</button>` : ''}<button class="mini no" data-act="ag" data-id="${a.id}" data-v="SUSPENDED">${a.status === 'PENDING' ? 'Rədd' : 'Dayandır'}</button><button class="mini" data-act="agshare" data-id="${a.id}" data-v="${a.custom ? Math.round(a.share * 100) : ''}">Komissiya %</button><button class="mini dk" data-act="aghosts" data-id="${a.id}" data-v="${esc(a.name)}">Hostlar</button><button class="mini" data-act="agcsv" data-id="${a.id}">CSV</button></td></tr>`)) + `<div id="agHosts"></div>`;
      },
      async settlements() {
        const week = $('#swk') ? $('#swk').value : prevWeek();
        const d = await api(`/admin/settlements?week=${week}`);
        const tot = d.items.reduce((a, r) => ({ p: a.p + r.paidCoins, h: a.h + r.hostAmount, g: a.g + r.agencyAmount }), { p: 0, h: 0, g: 0 });
        return `<h2 style="margin-bottom:18px">Həftəlik agentlik hesabatı</h2>
          <div class="toolbar"><input class="input" id="swk" type="date" value="${esc(d.week)}" title="Həftənin bazar ertəsi (Bakı)"><button class="btn sm dark" data-act="search">Göstər</button><button class="btn sm light" data-act="csvst" data-v="${esc(d.week)}">CSV</button></div>
          <p class="muted" style="margin-bottom:12px">Həftə bazar ertəsi 00:00 (Bakı) başlayır. Agentlik komissiyası sahibin pul kisəsinə dərhal yazılır və 7 gün gözləmədən sonra adi çıxarışla ödənilir. "Bağla" — həftənin cəmlərini qeyd edir (yoxlama və mühasibat üçün); təkrar bağlamaq olmur.</p>
          <div class="kpis" style="margin-bottom:16px"><div class="box kpi"><b>${fmt(tot.p)}</b><span>Ödənişli Nar</span></div><div class="box kpi" style="background:var(--mint-soft)"><b>${azn(tot.h)}</b><span>Hostlara</span></div><div class="box kpi" style="background:var(--lilac)"><b>${azn(tot.g)}</b><span>Agentliklərə</span></div><div class="box kpi" style="background:var(--saffron-soft)"><b>${azn(tot.p - tot.h - tot.g)}</b><span>Simo (nominal)</span></div></div>` +
          table(['Agentlik', 'Sahib', 'Host', 'Ödənişli Nar', 'Host payı', 'Komissiya', 'Status', ''], d.items.map((r) => `<tr>
          <td><b>${esc(r.agency?.name)}</b><div class="muted" style="font-size:12px">${esc(r.agency?.code)}</div></td>
          <td>${esc(r.agency?.owner?.name)} · ${esc(r.agency?.owner?.shortId)}<div class="muted" style="font-size:12px">${esc(r.agency?.owner?.phone || '')}</div></td>
          <td>${fmt(r.hosts)}</td><td>${fmt(r.paidCoins)}</td><td>${azn(r.hostAmount)}<div class="muted" style="font-size:12px">${almaz(r.hostAmount)} Almaz</div></td><td><b>${azn(r.agencyAmount)}</b><div class="muted" style="font-size:12px">${almaz(r.agencyAmount)} Almaz</div></td>
          <td>${r.settlement ? `<span class="st" style="background:var(--mint-soft)">Bağlanıb</span><div class="muted" style="font-size:12px">${date(r.settlement.createdAt)}</div>` : '<span class="st">Açıq</span>'}</td>
          <td class="acts">${r.settlement ? '' : `<button class="mini ok" data-act="settle" data-id="${r.agencyId}" data-v="${esc(d.week)}">Bağla</button>`}<button class="mini" data-act="agcsv" data-id="${r.agencyId}" data-v="${esc(d.week)}">Hostlar CSV</button></td></tr>`));
      },
      async raffles() {
        const { items } = await api('/admin/raffles');
        const soon = new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 16);
        return `<h2 style="margin-bottom:18px">Çəkilişlər</h2>
          <form id="rfForm" class="box" style="padding:16px;margin-bottom:18px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
            <input class="input" name="title" placeholder="Başlıq" required minlength="3" maxlength="80">
            <input class="input" name="prizeCoins" type="number" min="1" placeholder="Mükafat (promo Nar)" required>
            <input class="input" name="winners" type="number" min="1" max="100" value="1" placeholder="Qalib sayı">
            <input class="input" name="endsAt" type="datetime-local" value="${soon}" required>
            <input class="input" name="description" placeholder="Şərtlər (məs. paylaş və qatıl)" maxlength="500" style="grid-column:1/-1">
            <button class="btn sm dark" type="submit">Çəkiliş yarat</button>
          </form>
          <p class="muted" style="margin-bottom:12px">İştirak pulsuzdur. Qaliblər təsadüfi seçilir, mükafat promo Nar kimi yazılır (Almaz yaratmır).</p>` +
          table(['Çəkiliş', 'Mükafat', 'İştirakçı', 'Bitir', 'Status', ''], items.map((r) => `<tr>
          <td><b>${esc(r.title)}</b><div class="muted" style="font-size:12px;max-width:260px">${esc(r.description)}</div></td>
          <td>${fmt(r.prizeCoins)} Nar × ${fmt(r.winners)}</td><td>${fmt(r._count?.entries)}</td><td>${date(r.endsAt)}</td>
          <td>${r.drawnAt ? `<span class="st" style="background:var(--mint-soft)">Çəkilib</span><div class="muted" style="font-size:12px">${r.winnerIds.length} qalib</div>` : new Date(r.endsAt) < new Date() ? '<span class="st" style="background:var(--saffron-soft)">Bitib</span>' : '<span class="st">Aktiv</span>'}</td>
          <td class="acts">${r.drawnAt ? '' : `<button class="mini ok" data-act="draw" data-id="${r.id}">Qalibi seç</button>`}</td></tr>`));
      },
      async payments() {
        const { items } = await api('/admin/payments');
        return `<h2 style="margin-bottom:18px">Ödənişlər</h2>` + table(['İstifadəçi', 'Paket', 'Məbləğ', 'Provayder', 'Status', 'Tarix'], items.map((p) => `<tr>
          <td>${esc(p.user?.name)} · ${esc(p.user?.shortId)}</td><td>${esc(p.packageId)}</td><td>${(p.amountQepik / 100).toFixed(2)} ₼</td><td>${esc(p.provider)}</td><td><span class="st" style="background:${p.status === 'PAID' ? 'var(--mint-soft)' : p.status === 'FAILED' ? 'var(--nar-soft)' : 'var(--card)'}">${esc(p.status)}</span></td><td>${date(p.createdAt)}</td></tr>`));
      },
      async lives() {
        const { items } = await api('/admin/lives');
        return `<h2 style="margin-bottom:18px">Canlı yayınlar</h2>` + table(['Host', 'Başlıq', 'Növ', 'İzləyici', 'Başlayıb', ''], items.map((l) => `<tr>
          <td>${esc(l.host?.name)} · ${esc(l.host?.shortId)}</td><td>${esc(l.title)}</td><td>${esc(l.type)}</td><td>${fmt(l.viewerCount)}</td><td>${date(l.startedAt)}</td>
          <td><button class="mini no" data-act="endlive" data-id="${l.id}">Bitir</button></td></tr>`));
      },
    };

    async function render() {
      side();
      $('#view').innerHTML = '<div class="muted">Yüklənir…</div>';
      try { $('#view').innerHTML = await VIEWS[tab](); } catch (e) { if (e.message !== 'AUTH') $('#view').innerHTML = `<div class="notice err">Xəta: ${esc(e.message)}</div>`; }
    }

    $('#view').addEventListener('click', async (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const { act, id, v } = b.dataset;
      try {
        if (act === 'search') return render();
        if (act === 'host') await api(`/admin/users/${id}`, { hostStatus: v });
        if (act === 'ban') { if (!confirm('Əminsiniz?')) return; await api(`/admin/users/${id}`, { banned: v === 'true' }); }
        if (act === 'verify') await api(`/admin/users/${id}`, { verified: v === 'true' });
        if (act === 'grant') { const n = parseInt(prompt('Neçə Nar?') || '', 10); if (!(n > 0)) return; await api(`/admin/users/${id}`, { grantCoins: n }); }
        if (act === 'wd') {
          let reason = '';
          if (v === 'REJECTED') { reason = (prompt('Rədd səbəbi (istifadəçiyə görünür, Almaz geri qaytarılacaq)') || '').trim(); if (reason.length < 3) return toast('Səbəb məcburidir', false); }
          if (v === 'PAID' && !confirm('Pul köçürülüb? Bu əməliyyat geri alınmır.')) return;
          await api(`/admin/withdrawals/${id}`, { status: v, reason });
        }
        if (act === 'csvwd') { await download('/admin/withdrawals.csv', `withdrawals_${new Date().toISOString().slice(0, 10)}.csv`); return; }
        if (act === 'csvst') { await download(`/admin/settlements.csv?week=${v}`, `agency_week_${v}.csv`); return; }
        if (act === 'agcsv') { const wk = v || prevWeek(); await download(`/admin/agencies/${id}/report.csv?week=${wk}`, `agency_${id}_${wk}.csv`); return; }
        if (act === 'settle') { if (!confirm(`${v} həftəsi bağlansın?`)) return; await api('/admin/settlements/close', { agencyId: id, week: v }); }
        if (act === 'agshare') {
          const raw = prompt('Fərdi komissiya % (0–30). Boş — avtomatik səviyyə', v || '');
          if (raw === null) return;
          const customShare = raw.trim() === '' ? null : Number(raw) / 100;
          if (customShare !== null && !(customShare >= 0 && customShare <= 0.3)) return toast('0–30 arası olmalıdır', false);
          await api(`/admin/agencies/${id}`, { customShare });
        }
        if (act === 'aghosts') {
          const { items } = await api(`/admin/agencies/${id}/hosts?period=week`);
          $('#agHosts').innerHTML = `<h3 style="margin:22px 0 12px">${esc(v)} — hostlar (bu həftə)</h3>` + table(['Host', 'Onlayn', 'Zəng', 'Hədiyyə', 'Host payı', 'Komissiya', 'Qoşulub'], items.map((h) => `<tr>
            <td>${userCell(h)}</td><td>${h.online ? '🟢 ' : ''}${fmt(Math.round(h.onlineMin / 6) / 10)} saat</td><td>${fmt(h.calls)} · ${fmt(h.callMin)} dəq</td><td>${fmt(h.gifts)}</td><td>${azn(h.hostAmount)}</td><td>${azn(h.agencyAmount)}</td><td>${date(h.agencyJoinedAt)}</td></tr>`));
          $('#agHosts').scrollIntoView({ behavior: 'smooth' });
          return;
        }
        if (act === 'rep') await api(`/admin/reports/${id}`, { status: v });
        if (act === 'repban') { if (!confirm('İstifadəçi bloklansın?')) return; await api(`/admin/reports/${id}`, { status: 'RESOLVED', banUser: true }); }
        if (act === 'ag') { const rejectReason = v === 'SUSPENDED' ? (prompt('Səbəb (agentliyə görünür)') || '') : ''; await api(`/admin/agencies/${id}`, { status: v, ...(rejectReason ? { rejectReason } : {}) }); }
        if (act === 'kyc') { const note = v === 'REJECTED' ? (prompt('Səbəb (istifadəçiyə görünür)') || '') : ''; await api(`/admin/kyc/${id}`, { status: v, note }); }
        if (act === 'draw') { if (!confirm('Qaliblər indi seçilsin?')) return; const r = await api(`/admin/raffles/${id}/draw`, {}); toast(`${r.winners.length} qalib seçildi`); }
        if (act === 'endlive') { if (!confirm('Yayın bitirilsin?')) return; await api(`/admin/lives/${id}/end`, {}); }
        toast('Yadda saxlanıldı');
        counts = await api('/admin/stats');
        render();
      } catch (err) { if (err.message !== 'AUTH') toast(`Xəta: ${err.message}`, false); }
    });
    $('#view').addEventListener('submit', async (e) => {
      if (e.target.id !== 'rfForm') return;
      e.preventDefault();
      const f = new FormData(e.target);
      try {
        await api('/admin/raffles', { title: f.get('title'), description: f.get('description') || '', prizeCoins: Number(f.get('prizeCoins')), winners: Number(f.get('winners') || 1), endsAt: new Date(f.get('endsAt')).toISOString() });
        toast('Çəkiliş yaradıldı'); render();
      } catch (err) { if (err.message !== 'AUTH') toast(`Xəta: ${err.message}`, false); }
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'uq') render(); });

    async function start() {
      $('#loginForm').classList.add('hidden'); $('#app').classList.remove('hidden'); $('#logout').classList.remove('hidden');
      try { counts = await api('/admin/stats'); } catch (e) { return; }
      render();
    }
    if (token) start(); else logout();
  })();
  </script>
</body>
</html>
